[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robloxhive"
version = "0.5.0"
description = "Modular brain/body architecture for an autonomous Roblox agent"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "psutil>=5.9",
]

[project.optional-dependencies]
windows = [
  "pywin32>=306",
  "pyrobloxbot",
  "pydirectinput",
  "numpy>=1.26",
  "opencv-python>=4.10",
]
brain = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=13",
  "aiosqlite>=0.20",
  "ddgs>=9.16,<10",
]
all = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=13",
  "aiosqlite>=0.20",
  "ddgs>=9.16,<10",
  "pywin32>=306",
  "pyrobloxbot",
  "pydirectinput",
  "numpy>=1.26",
  "opencv-python>=4.10",
]

[tool.setuptools.packages.find]
include = ["robloxhive*"]

[tool.setuptools.package-data]
robloxhive = ["interface/static/*.html"]
