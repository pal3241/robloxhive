[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robloxhive"
version = "0.1.0"
description = "Modular brain/body architecture for an autonomous Roblox agent"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "psutil>=5.9",
]

[project.optional-dependencies]
windows = ["pywin32>=306", "pyrobloxbot", "pydirectinput"]
brain = ["fastapi>=0.115", "uvicorn>=0.30", "websockets>=13", "aiosqlite>=0.20"]

[tool.setuptools.packages.find]
include = ["robloxhive*"]
